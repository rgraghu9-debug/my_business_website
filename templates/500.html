<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temporary Maintenance — Siddhi Vinayaka Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fbf9f6;
      color: #1b1c1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e2df;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 700;
      color: #735c00;
      background: #fed65b33;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      color: #590018;
      font-size: 2rem;
      margin-bottom: 0.75rem;
      line-height: 1.25;
    }
    p {
      color: #564243;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-wa {
      background: #25D366;
      color: #ffffff;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }
    .btn-wa:hover {
      background: #1eb954;
    }
    .btn-home {
      background: #590018;
      color: #ffffff;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn-home:hover {
      background: #7a162b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Siddhi Vinayaka Cards</div>
    <h1>We'll Be Right Back</h1>
    <p>Our ceremonial stationery catalog is currently undergoing a brief update or maintenance. If you are inquiring about a wedding invitation design or bespoke sample, please reach us directly on WhatsApp.</p>
    <div class="btn-group">
      <a class="btn-wa" href="https://wa.me/919618022264?text=Hello%20Siddhi%20Vinayaka%20Cards!%20I%20am%20inquiring%20about%20wedding%20invitation%20catalogs.">
        Inquire Directly via WhatsApp
      </a>
      <a class="btn-home" href="/">
        Reload Website
      </a>
    </div>
  </div>
</body>
</html>
