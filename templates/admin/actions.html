{% load i18n %}
<div class="actions flex items-center gap-2 text-xs">
  {% for field in action_form %}{% if field.label %}<label class="text-ink-700 font-medium">{{ field.label }}: {% endif %}{{ field }}{% if field.label %}</label>{% endif %}{% endfor %}
  <button type="submit" class="button px-3.5 py-1.5 bg-parchment-100 hover:bg-gold-100 border border-gold-500/40 text-regal-900 font-semibold text-xs rounded-md shadow-2xs transition-colors" title="Run the selected action" name="index" value="{{ action_index|default:0 }}">Go</button>
  {% if actions_selection_counter %}
    <span class="action-counter text-[11px] text-ink-500 font-mono" data-actions-icnt="{{ cl.result_list|length }}">{{ selection_note }}</span>
  {% endif %}
</div>
