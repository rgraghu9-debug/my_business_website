services:
  - type: web
    name: siddhi-vinayak-cards
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn weddingcards.wsgi --workers 2 --timeout 60"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: siddhi-vinayak-db
          property: connectionString

databases:
  - name: siddhi-vinayak-db
    databaseName: weddingcards
    user: weddingcards_user
    plan: free
